# Narrow ruff config: catch the bug classes we already cleaned up
# (bare excepts, redefined symbols, true/false comparisons) without
# flagging the existing codebase's style nits. Broaden over time.

target-version = "py312"

[lint]
select = [
    "E722",  # bare except
    "E712",  # `== True` / `== False` comparisons
    "F811",  # redefined while unused
    "F821",  # undefined name
    "F823",  # local variable referenced before assignment
    "F401",  # unused imports
    "F841",  # unused local variables
]

[lint.per-file-ignores]
# Tests legitimately redefine fixtures
"tests/*.py" = ["F811"]
