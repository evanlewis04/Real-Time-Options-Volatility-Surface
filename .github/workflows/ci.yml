name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check src tests diagnostic.py dashboard_connector.py app.py main.py scripts

      - name: Compile Python sources
        run: python -m compileall src tests scripts dashboard_connector.py diagnostic.py app.py main.py

      - name: Test
        run: python -m pytest -q

      - name: Dashboard smoke
        run: python -m scripts.healthcheck
